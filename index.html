<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接住健康：腦中風防護小遊戲</title>
<style>
:root{--bg:#eef5f6;--card:#fff;--ink:#0b2f57;--sub:#4a6178;--teal:#1fa885;--red:#e5484d;--line:#d5e3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2a;--card:#14283d;--ink:#e6f0f7;--sub:#9fb4c6;--line:#27425c}}
:root[data-theme="dark"]{--bg:#0d1b2a;--card:#14283d;--ink:#e6f0f7;--sub:#9fb4c6;--line:#27425c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:8px}
#fast{display:flex;gap:4px}
#fast span{width:28px;height:28px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--sub)}
#fast span.on{background:var(--teal);border-color:var(--teal);color:#fff}
#stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:var(--card)}
canvas{display:block;width:100%;height:auto;touch-action:none}
#toast{position:absolute;left:8px;right:8px;top:8px;padding:8px 12px;border-radius:10px;font-size:15px;font-weight:600;color:#fff;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.ov{position:absolute;inset:0;background:var(--card);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.ov.hide{display:none}
.ov h2{margin:0;font-size:22px}
.ov p,.ov li{font-size:16px;line-height:1.6;margin:0}
.ov ul{padding-left:20px;margin:0}
button{font:inherit;font-size:18px;font-weight:700;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;min-height:48px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.score{font-size:44px;font-weight:800;color:var(--teal)}
.note{font-size:14px;color:var(--sub);border-top:1px solid var(--line);padding-top:8px}
.legend b{color:var(--teal)}.legend i{color:var(--red);font-style:normal;font-weight:700}
</style>
</head>
<body>
<div id="app">
<h1>接住健康：腦中風防護小遊戲</h1>
<div id="hud"><span>分數 <span id="sc">0</span></span><span id="fast" aria-label="FAST 收集進度"></span><span>⏱ <span id="tm">60</span></span></div>
<div id="stage">
<canvas id="cv" width="360" height="480"></canvas>
<div id="toast"></div>
<div class="ov" id="start">
<h2>遊戲說明</h2>
<p class="legend">用手指拖曳（或按鍵盤 ←、→）移動籃子。<br><b>接住健康好習慣</b>加分，<i>閃避壞習慣小怪物</i>，碰到會扣分。</p>
<p>另外會掉落 <b style="color:var(--teal)">F、A、S、T</b> 四個字母，依序集滿有大獎勵，這是中風第一時間辨識口訣！</p>
<p>遊戲時間 60 秒，結束後會顯示總分與重點回顧。</p>
<button id="go">開始遊戲</button>
</div>
<div class="ov hide" id="end"></div>
</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=360,H=480;
const $=id=>document.getElementById(id);
const GOOD=[
['🥬','深綠蔬菜','深綠色蔬菜富含鎂與鉀，協助血管舒張'],
['🍌','香蕉水果','香蕉、柑橘類有助平衡體內鈉離子'],
['🥛','低脂乳品','低脂乳製品補充鈣質，維持心血管穩定'],
['🌾','糙米燕麥','糙米、燕麥取代白米飯，增加纖維質攝取'],
['🩺','量血壓','722：連續7天、早晚各2遍、每遍量2次取平均'],
['💊','規律服藥','使用降壓藥可降低 35-40% 的中風風險'],
['🏃','每天運動','即使過了半年，仍須每天堅持運動防止退化'],
['🚭','戒菸','絕對戒菸！吸菸直接損害血管']];
const BAD=[
['高鹽','每日食鹽應低於 5 公克，少吃加工食品與醃漬物'],
['吸菸','吸菸直接損害血管，10% 患者發病與此相關'],
['反式脂肪','減少反式脂肪，壞膽固醇（LDL）會加速動脈硬化'],
['便秘用力','便秘用力會讓血壓突然飆升，多吃蔬果纖維']];
const FAST=[['F','Face 臉：請對方微笑，看臉是否不對稱、半邊僵硬'],['A','Arm 手：雙手平舉，看是否一隻手緩慢下墜無力'],['S','Speech 說話：說一句簡單的話，看是否口齒不清'],['T','Time 時間：任一項異常，立即記錄時間並撥打 119']];
const fe=$('fast');'FAST'.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c;fe.appendChild(s)});
let items,px,score,time,spawnT,fastT,fastN,running,last,seen,toastTimer,bumps;
function dpr(){const r=window.devicePixelRatio||1;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}dpr();
function toast(msg,c){const t=$('toast');t.textContent=msg;t.style.background=c;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function start(){items=[];px=W/2;score=0;time=60;spawnT=0.5;fastT=6;fastN=0;seen={};bumps=0;running=true;last=performance.now();
$('start').classList.add('hide');$('end').classList.add('hide');upd();[...fe.children].forEach(s=>s.classList.remove('on'));requestAnimationFrame(loop)}
function upd(){$('sc').textContent=score;$('tm').textContent=Math.ceil(time)}
function spawn(kind){const x=30+Math.random()*(W-60);const base=110+(60-time)*1.3;
if(kind==='fast'){const f=FAST[fastN];items.push({k:'fast',x,y:-30,v:base*0.9,e:f[0],l:'',tip:f[1]})}
else if(kind==='bad'){const b=BAD[Math.random()*BAD.length|0];items.push({k:'bad',x,y:-30,v:base*1.05,e:'',l:b[0],tip:b[1]})}
else{const g=GOOD[Math.random()*GOOD.length|0];items.push({k:'good',x,y:-30,v:base,e:g[0],l:g[1],tip:g[2]})}}
function loop(t){if(!running)return;const dt=Math.min(0.05,(t-last)/1000);last=t;time-=dt;
spawnT-=dt;fastT-=dt;
if(spawnT<=0){spawn(Math.random()<0.3?'bad':'good');spawnT=0.85-(60-time)*0.005}
if(fastT<=0&&fastN<4){spawn('fast');fastT=5.5}
if(key.l)px-=300*dt;if(key.r)px+=300*dt;px=Math.max(36,Math.min(W-36,px));
const py=H-52;
items=items.filter(it=>{it.y+=it.v*dt;
if(it.y>py-18&&it.y<py+22&&Math.abs(it.x-px)<44){hit(it);return false}
return it.y<H+40});
draw();upd();
if(time<=0){finish();return}requestAnimationFrame(loop)}
function hit(it){
if(it.k==='good'){score+=10;toast('✔ +10　'+it.tip,'#1fa885')}
else if(it.k==='bad'){score=Math.max(0,score-15);bumps++;toast('✘ -15　'+it.l+'：'+it.tip,'#e5484d')}
else{const need=FAST[fastN][0];if(it.e===need){score+=20;fe.children[fastN].classList.add('on');fastN++;
if(fastN===4){score+=50;toast('🎉 FAST 集滿 +50！任一項異常，立即撥打 119','#0b3560')}else toast('✔ +20　'+it.tip,'#1fa885')}}
}
function draw(){ctx.clearRect(0,0,W,H);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e8f6f3');g.addColorStop(1,'#cfe6ee');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.textAlign='center';ctx.textBaseline='middle';
items.forEach(it=>{
if(it.k==='bad'){monster(it)}
else if(it.k==='fast'){ctx.fillStyle=it.e==='T'?'#e5484d':'#1fa885';rr(it.x-22,it.y-22,44,44,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText(it.e,it.x,it.y+1)}
else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(it.x,it.y,24,0,7);ctx.fill();ctx.font='28px sans-serif';ctx.fillText(it.e,it.x,it.y+2);ctx.fillStyle='#0b2f57';ctx.font='bold 12px sans-serif';ctx.fillText(it.l,it.x,it.y+36)}});
ctx.font='52px sans-serif';ctx.fillText('🧺',px,H-52)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function monster(it){const{x,y}=it;ctx.fillStyle='#7b3fa0';ctx.beginPath();
for(let i=0;i<16;i++){const a=i*Math.PI/8,r=i%2?19:27;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-7,y-4,5,0,7);ctx.arc(x+7,y-4,5,0,7);ctx.fill();
ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x-7,y-3,2.2,0,7);ctx.arc(x+7,y-3,2.2,0,7);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+11,6,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
ctx.font='bold 13px sans-serif';const w=ctx.measureText(it.l).width+12;ctx.fillStyle='#e5484d';rr(x-w/2,y+28,w,20,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(it.l,x,y+38.5)}
function finish(){running=false;draw();upd();
const r=score>=300?['🏆','腦中風防護小達人']:score>=150?['👍','表現不錯，繼續保持']:['💪','再玩一次，把好習慣記起來'];
const e=$('end');e.classList.remove('hide');
e.innerHTML=`<h2>${r[0]} ${r[1]}</h2><div class="score">${score} 分</div><p>FAST 集滿 ${fastN}/4　｜　碰到壞習慣 ${bumps} 次</p>
<h2 style="font-size:18px">重點回顧</h2><ul>
<li><b>FAST 口訣</b>：臉歪（Face）、手無力（Arm）、說話不清（Speech），任一異常立刻記錄時間並撥打 119（Time）。</li>
<li><b>血壓</b>：正常血壓為收縮壓 &lt; 120 mmHg 且舒張壓 &lt; 80 mmHg；量測遵循 722 原則。</li>
<li><b>飲食</b>：每日食鹽低於 5 公克；以糙米、燕麥取代白米飯，增加纖維質攝取。</li>
<li><b>避免便秘</b>：多吃蔬菜、水果、低脂乳品，避免用力排便讓血壓飆升。</li>
<li><b>戒菸與三高</b>：絕對戒菸，持續追蹤糖尿病、高血脂與心律不整。</li>
<li><b>復健黃金半年</b>：中風後半年進步最快，之後仍要每天運動防止退化。</li></ul>
<p class="note">☆ 飲食與用藥建議請遵照醫師指示為主★<br>本遊戲為衛教輔助，不能取代醫療診斷。</p>
<button id="again">再玩一次</button>`;
$('again').onclick=start}
const key={l:0,r:0};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')key.l=1;if(e.key==='ArrowRight'||e.key==='d')key.r=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')key.l=0;if(e.key==='ArrowRight'||e.key==='d')key.r=0});
function mv(e){const b=cv.getBoundingClientRect();px=(e.clientX-b.left)/b.width*W}
cv.addEventListener('pointermove',e=>{if(running)mv(e)});
cv.addEventListener('pointerdown',e=>{if(running)mv(e)});
$('go').onclick=start;draw();
</script>
</body>
</html>
